<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A real candle burning">
  <!-- Candle on solid black so it composites with mix-blend-mode:screen exactly
       like the black-background video: the black vanishes, only the candle and
       its glow remain. No room, no desk, no rectangle. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#ffdca0" stop-opacity="0.85"/>
      <stop offset="34%" stop-color="#e2a46b" stop-opacity="0.42"/>
      <stop offset="66%" stop-color="#b5502e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2f22"/>
      <stop offset="30%" stop-color="#c9b489"/>
      <stop offset="52%" stop-color="#efe1c4"/>
      <stop offset="72%" stop-color="#b39a72"/>
      <stop offset="100%" stop-color="#241a10"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="70%" r="62%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="26%" stop-color="#ffe6b0"/>
      <stop offset="60%" stop-color="#e2953f"/>
      <stop offset="100%" stop-color="#b5502e" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="64%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffe9c2"/>
      <stop offset="100%" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="b1" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <rect width="600" height="800" fill="#000000"/>

  <!-- halo -->
  <ellipse cx="300" cy="330" rx="230" ry="300" fill="url(#glow)" filter="url(#b1)"/>

  <!-- candle body -->
  <g>
    <rect x="252" y="452" width="96" height="288" rx="10" fill="url(#wax)"/>
    <ellipse cx="300" cy="452" rx="48" ry="12" fill="#f3e7cf"/>
    <ellipse cx="300" cy="452" rx="22" ry="5.5" fill="#5f4a30"/>
  </g>

  <!-- wick -->
  <path d="M300 452 q-3 -18 1 -34" fill="none" stroke="#241606" stroke-width="3.4" stroke-linecap="round"/>

  <!-- flame -->
  <ellipse cx="300" cy="382" rx="58" ry="88" fill="#e2953f" opacity="0.55" filter="url(#b1)"/>
  <path d="M300 286 C 266 338, 254 378, 254 410 a46 48 0 0 0 92 0 C 346 378, 334 338, 300 286 Z" fill="url(#flame)" filter="url(#b2)"/>
  <path d="M300 344 C 286 374, 282 396, 282 414 a18 21 0 0 0 36 0 C 318 396, 314 374, 300 344 Z" fill="url(#core)"/>
</svg>
